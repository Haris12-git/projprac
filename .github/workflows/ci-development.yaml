name: wf-ci-development
on:
  pull_request:
    branches:
      - develop
jobs:
  ci-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: clone Repo
        uses: actions/checkout@v4
      - name: lint html
        run: npx htmlhint "**/*.html"
      - name: lint style
        run: npx stylelint "**/*.css"
      - name: build
        run: npx parcel build "./src/index.html"  --dist-dir "./dist" --public-url "./"